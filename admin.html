<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Admin Paneli | Selçuk Hukuk</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      min-height:100vh;
      font-family:Arial, sans-serif;
      color:#f5e6b8;
      background:
        radial-gradient(circle at 20% 20%, rgba(60,110,80,.22), transparent 35%),
        radial-gradient(circle at 80% 70%, rgba(120,90,35,.12), transparent 35%),
        #07150f;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:25px;
    }

    .admin-box{
      width:100%;
      max-width:520px;
      padding:35px 25px;
      border:1px solid rgba(216,198,160,.25);
      border-radius:20px;
      background:rgba(10,28,20,.78);
      box-shadow:0 25px 80px rgba(0,0,0,.45);
      backdrop-filter:blur(18px);
      text-align:center;
    }

    .lock{
      font-size:42px;
      margin-bottom:15px;
    }

    h1{
      font-size:25px;
      letter-spacing:3px;
      margin-bottom:8px;
    }

    .subtitle{
      color:#bcae8b;
      font-size:13px;
      margin-bottom:30px;
    }

    label{
      display:block;
      text-align:left;
      margin-bottom:8px;
      color:#d8c6a0;
      font-size:13px;
    }

    input{
      width:100%;
      padding:14px;
      margin-bottom:18px;
      border:1px solid rgba(216,198,160,.25);
      border-radius:10px;
      outline:none;
      background:#06120d;
      color:#fff;
      font-size:15px;
    }

    input:focus{
      border-color:#d8c6a0;
    }
 
    button{
      width:100%;
      padding:14px;
      border:0;
      border-radius:10px;
      cursor:pointer;
      font-size:14px;
      font-weight:bold;
      letter-spacing:1px;
      color:#08130e;
      background:linear-gradient(90deg,#b99a55,#f5e6a8,#b99a55);
    }

    .back{
      display:block;
      margin-top:20px;
      color:#bcae8b;
      text-decoration:none;
      font-size:12px;
    }

    .back:hover{
      color:#fff;
    }
  </style>
</head>

<body>

  <div class="admin-box">

    <div class="lock">🔐</div>

    <h1>ADMİN PANELİ</h1>

    <div class="subtitle">
      Selçuk Hukuk &amp; Danışmanlık
    </div>

    <form>
      <label for="username">Kullanıcı Adı</label>
      <input
        id="username"
        type="text"
        placeholder="Kullanıcı adı"
        autocomplete="username"
      >

      <label for="password">Şifre</label>
      <input
        id="password"
        type="password"
        placeholder="Şifre"
        autocomplete="current-password"
      >

      <button type="submit">
        GİRİŞ YAP
      </button>
    </form>

    <a class="back" href="index.html">
      ← Ana Sayfaya Dön
    </a>

  </div>
<script>
document.querySelector("form").addEventListener("submit", function(e) {
  e.preventDefault();

  const kullanici = document.getElementById("username").value;
  const sifre = document.getElementById("password").value;

  if (kullanici === "admin" && sifre === "123456") {
    alert("Giriş başarılı!");
    window.location.href = "admin-panel.html";
  } else {
    alert("Kullanıcı adı veya şifre hatalı!");
  }
});
</script>
   
</body>
</html>
