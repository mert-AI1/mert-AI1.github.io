<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Admin Paneli | Selçuk Hukuk</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at 20% 20%,rgba(80,120,90,.25),transparent 35%),
    radial-gradient(circle at 80% 80%,rgba(180,150,70,.15),transparent 35%),
    #07150f;
  color:#f5e6b8;
}

.admin-box{
  width:100%;
  max-width:500px;
  padding:35px 25px;
  border:1px solid rgba(216,198,160,.3);
  border-radius:20px;
  background:rgba(10,28,20,.9);
  box-shadow:0 20px 70px rgba(0,0,0,.5);
  text-align:center;
}

.lock{
  font-size:45px;
  margin-bottom:15px;
}

h1{
  font-size:25px;
  letter-spacing:3px;
  margin-bottom:8px;
}

.subtitle{
  color:#bcae8b;
  font-size:13px;
  margin-bottom:30px;
}

label{
  display:block;
  text-align:left;
  margin-bottom:8px;
  color:#d8c6a0;
  font-size:13px;
}

input{
  width:100%;
  padding:15px;
  margin-bottom:18px;
  border:1px solid rgba(216,198,160,.3);
  border-radius:10px;
  outline:none;
  background:#06120d;
  color:white;
  font-size:16px;
}

button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:10px;
  cursor:pointer;
  font-size:14px;
  font-weight:bold;
  letter-spacing:1px;
  color:#08130e;
  background:linear-gradient(90deg,#b99a55,#f5e6a8,#b99a55);
}

#sonuc{
  margin-top:18px;
  min-height:20px;
  font-size:14px;
  line-height:1.5;
  word-break:break-word;
}

.back{
  display:block;
  margin-top:20px;
  color:#bcae8b;
  text-decoration:none;
  font-size:12px;
}
</style>
</head>

<body>

<div class="admin-box">

  <div class="lock">🔐</div>

  <h1>ADMİN PANELİ</h1>

  <div class="subtitle">
    Selçuk Hukuk &amp; Danışmanlık
  </div>

  <form id="loginForm">

    <label for="email">E-posta</label>

    <input
      id="email"
      type="email"
      placeholder="E-posta adresi"
      autocomplete="email"
      required
    >

    <label for="password">Şifre</label>

    <input
      id="password"
      type="password"
      placeholder="Şifre"
      autocomplete="current-password"
      required
    >

    <button type="submit">
      GİRİŞ YAP
    </button>

  </form>

  <div id="sonuc"></div>

  <a class="back" href="index.html">
    ← Ana Sayfaya Dön
  </a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>

const sonuc = document.getElementById("sonuc");

document.getElementById("loginForm").addEventListener("submit", async function(e){

  e.preventDefault();

  sonuc.textContent = "Giriş kontrol ediliyor...";
  sonuc.style.color = "#d8c6a0";

  try {

    if(typeof supabase === "undefined"){
      throw new Error("Supabase kütüphanesi yüklenmedi.");
    }

    if(typeof SUPABASE_URL === "undefined"){
      throw new Error("SUPABASE_URL bulunamadı. supabase-config.js kontrol edilmeli.");
    }

    if(typeof SUPABASE_ANON_KEY === "undefined"){
      throw new Error("SUPABASE_ANON_KEY bulunamadı. supabase-config.js kontrol edilmeli.");
    }

    const db = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const { data, error } =
      await db.auth.signInWithPassword({
        email: email,
        password: password
      });

    if(error){
      sonuc.textContent =
        "❌ " + error.message;
      sonuc.style.color = "#ff6b6b";
      return;
    }

    if(data && data.session){

      sonuc.textContent =
        "✅ Giriş başarılı! Panel açılıyor...";
      sonuc.style.color = "#7cff9b";

      setTimeout(function(){
        window.location.href = "admin-panel.html";
      },700);

      return;
    }

    sonuc.textContent =
      "❌ Oturum oluşturulamadı.";
    sonuc.style.color = "#ff6b6b";

  } catch(error){

    sonuc.textContent =
      "❌ Teknik hata: " + error.message;

    sonuc.style.color = "#ff6b6b";

  }

});

</script>

</body>
</html>
