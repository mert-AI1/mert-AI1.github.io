<!doctype html>
<html lang="tr"> 
<head> 
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b0d">
  <meta name="description" content="Av. Bahar Selçuk — İzmir ve Didim ofisleri üzerinden hukuki danışmanlık ve dava takibi hizmetleri.">
  <title>Av. Bahar Selçuk | Hukuk & Danışmanlık</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
 <style>
#password-screen {
  position: fixed;
  inset: 0;
  z-index: 99999;
  background: #0d0b0d;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  text-align: center;
}

.password-box {
  width: 100%;
  max-width: 380px;
  padding: 40px 28px;
  border: 1px solid rgba(255,255,255,.15);
  background: rgba(20,17,20,.95);
  border-radius: 16px;
}

.password-box h2 {
  color: #fff;
  margin-bottom: 10px;
}

.password-box p {
  color: #aaa;
  margin-bottom: 24px;
}

.password-box input {
  width: 100%;
  padding: 14px;
  box-sizing: border-box;
  border-radius: 8px;
  border: 1px solid #555;
  background: #111;
  color: #fff;
  margin-bottom: 12px;
}

.password-box button {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
}

#password-error {
  color: #d88;
  margin-top: 12px;
  display: none;
}
</style>

<div id="password-screen">
  <div class="password-box">
    <h2>Özel Erişim</h2>
    <p>Siteye giriş yapmak için şifreyi giriniz.</p>

    <input type="password" id="site-password" placeholder="Şifre">
    <button onclick="checkSitePassword()">Giriş Yap</button>

    <div id="password-error">Şifre yanlış.</div>
  </div>
</div>

<script>
  function checkSitePassword() {
  const password = document.getElementById("site-password").value;

  if (password === "Mert0216") {
    document.getElementById("password-screen").style.display = "none";
    sessionStorage.setItem("siteAccess", "1");
  } else {
    document.getElementById("password-error").style.display = "block";
  }
}

if (sessionStorage.getItem("siteAccess") === "1") {
  document.getElementById("password-screen").style.display = "none";
}
</script>
</body>
</html>
