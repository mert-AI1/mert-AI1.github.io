<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Supabase Test</title>
</head>
<body>

<h2>Supabase Bağlantı Testi</h2>

<pre id="sonuc">Kontrol ediliyor...</pre>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
(async function () {

  const sonuc = document.getElementById("sonuc");

  try {

    const db = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const { data, error } = await db
      .from("site_icerigi")
      .select("*")
      .limit(1);

    if (error) {
      sonuc.textContent =
        "HATA:\n\n" + JSON.stringify(error, null, 2);
      return;
    }

    sonuc.textContent =
      "VERİTABANINDAN GELEN GERÇEK VERİ:\n\n" +
      JSON.stringify(data, null, 2);

  } catch (e) {

    sonuc.textContent =
      "JAVASCRIPT HATASI:\n\n" +
      e.message;

  }

})();
</script>

</body>
</html>
