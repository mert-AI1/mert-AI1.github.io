<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Supabase Test</title>
</head>
<body>

<h2>Supabase Bağlantı Testi</h2>
<div id="sonuc">Kontrol ediliyor...</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
(async function () {

  const sonuc = document.getElementById("sonuc");

  try {

    const db = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const { data, error } = await db
      .from("site_icerigi")
      .select("*")
      .limit(1);

    if (error) {
      sonuc.innerHTML =
        "❌ HATA<br><br>" + error.message;
      return;
    }

    if (!data || data.length === 0) {
      sonuc.innerHTML = "⚠️ Tablo boş.";
      return;
    }

    const kayit = data[0];

    sonuc.innerHTML = `
      <h3>✅ SUPABASE ÇALIŞIYOR</h3>
      <p><b>Avukat:</b> ${kayit.avukat_adi ?? "YOK"}</p>
      <p><b>Başlık:</b> ${kayit.site_basligi ?? "YOK"}</p>
      <p><b>Açıklama:</b> ${kayit.aciklama ?? "YOK"}</p>
      <p><b>Uluslararası:</b> ${kayit.uluslararasi ?? "YOK"}</p>
      <hr>
      <pre>${JSON.stringify(kayit, null, 2)}</pre>
    `;

  } catch (e) {

    sonuc.innerHTML =
      "❌ JavaScript Hatası<br><br>" + e.message;

  }

})();
</script>

</body>
</html>
